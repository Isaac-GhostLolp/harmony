name: Android

# Builds the Android test app (.apk). Download it from the run's "Artifacts"
# section (Actions → Android → latest run). Not attached to the desktop
# releases yet: the Android app is still being tested.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build the web app and copy it into Android
        run: npm run android:sync

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk/Harmony-${VERSION}-android.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: harmony-android
          path: apk/*.apk

